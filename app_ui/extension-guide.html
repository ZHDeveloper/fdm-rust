<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>安装浏览器扩展</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: "Segoe UI","Microsoft YaHei",Tahoma,sans-serif; font-size: 11px; color: #1a1a1a;
    background: #f0f0f0; -webkit-user-select: none; user-select: none; display: flex; flex-direction: column; overflow: hidden; }

  .scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 20px 12px 10px; background: #f0f0f0;
    scrollbar-width: thin; scrollbar-color: rgba(0,0,0,0.18) #f0f0f0; }
  .scroll::-webkit-scrollbar { width: 15px; }
  .scroll::-webkit-scrollbar-track { background: #f0f0f0; }
  .scroll::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.18); border: 3px solid #f0f0f0; }
  .scroll::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,0.28); }

  /* 分组框：仿 Win32 GroupBox */
  .section { position: relative; background: #f0f0f0; border: 0.5px solid rgba(0,0,0,0.12); border-radius: 6px;
    padding: 14px 12px 10px; margin: 0 0 22px; }
  .section:last-child { margin-bottom: 0; }
  .section h2 { position: absolute; top: -8px; left: 9px; padding: 0 5px; background: #f0f0f0;
    font-size: 11px; font-weight: 400; color: #1a1a1a; margin: 0; line-height: 1; }

  .row { display: flex; align-items: center; margin-bottom: 6px; min-height: 24px; }
  .row:last-child { margin-bottom: 0; }
  .row.top { align-items: flex-start; }
  .row.top > label { padding-top: 2px; }
  .row label { flex: 0 0 70px; margin-right: 9px; color: #1a1a1a; line-height: 18px; }
  .row label:empty { flex: 0 0 0; margin-right: 0; }
  .row .ctrl { flex: 1; display: flex; align-items: center; gap: 8px; min-width: 0; }

  input[type=text], select {
    padding: 2px 5px; border: 0.5px solid rgba(0,0,0,0.20); border-radius: 4px; font-size: 11px;
    font-family: inherit; color: #1a1a1a; background: #fff; height: 22px; outline: none; }
  input[type=text]:focus, select:focus { border-color: #0078d7; }
  select { padding: 2px 4px; }
  input[type=text] { flex: 1; min-width: 0; }
  input[type=text][readonly] { color: #333; font-family: Consolas, "Microsoft YaHei", monospace; }

  .btn { padding: 3px 12px; border: 0.5px solid rgba(0,0,0,0.20); border-radius: 5px; background: #fff;
    color: #1a1a1a; cursor: pointer; font-size: 11px; font-family: inherit; min-height: 24px;
    min-width: 84px; white-space: nowrap; }
  .btn:hover { background: #e5f1fb; border-color: #0078d7; }
  .btn:active { background: #cce4f7; }

  .desc { color: #1a1a1a; line-height: 18px; }
  .steps { margin: 0; padding-left: 16px; color: #1a1a1a; line-height: 18px; }
  .steps li { margin-bottom: 5px; }
  .steps li:last-child { margin-bottom: 0; }
  code { background: #eef1f4; padding: 0 3px; border-radius: 2px; font-family: Consolas, monospace; font-size: 10px; }
  .inline-hint { margin-top: 6px; color: #8a6d3b; line-height: 16px; -webkit-user-select: text; user-select: text; }
  .inline-hint:empty { display: none; }

  .status-wrap { display: flex; align-items: center; gap: 7px; line-height: 18px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #b0b0b0; flex: 0 0 auto; }
  .dot.ok { background: #107c10; }
  .dot.warn { background: #c19a00; }

  .foot { flex: 0 0 auto; padding: 8px 12px; background: #f0f0f0;
    border-top: 0.5px solid rgba(0,0,0,0.12); display: flex; align-items: center; gap: 8px; }
  .foot .spacer { flex: 1; }
  .hint { color: #666; line-height: 16px; }
  input, textarea { -webkit-user-select: text; user-select: text; }
</style>
</head>
<body>
  <div class="scroll">
    <div class="section">
      <h2>浏览器扩展</h2>
      <div class="row">
        <label>说明</label>
        <div class="ctrl"><span class="desc">安装后，Chrome、Edge 及其他 Chromium 内核浏览器的下载会自动交给 FDM 接管，支持右键下载与下载状态提示。</span></div>
      </div>
      <div class="row">
        <label>浏览器</label>
        <div class="ctrl" style="flex-wrap:wrap">
          <select id="browserSelect">
            <option value="chrome">Google Chrome</option>
            <option value="edge">Microsoft Edge</option>
            <option value="chromium">其他 Chromium 浏览器</option>
          </select>
          <button class="btn" id="openExtensionsPage">打开 Chrome 扩展页</button>
          <div class="inline-hint" id="pageHint" style="flex:0 0 100%; margin-top:4px"></div>
        </div>
      </div>
      <div class="row top">
        <label>安装步骤</label>
        <div class="ctrl">
          <ol class="steps">
            <li>打开浏览器扩展管理页（<code id="extPageText">chrome://extensions</code>）。</li>
            <li>打开页面右上角的「开发者模式」。</li>
            <li>点击页面左上角的「加载已解压的扩展程序」。</li>
            <li>选择下方的 FDM 扩展目录，然后点击「选择文件夹」。</li>
          </ol>
        </div>
      </div>
    </div>

    <div class="section">
      <h2>扩展目录</h2>
      <div class="row">
        <label>目录</label>
        <div class="ctrl">
          <input type="text" id="extensionPath" readonly aria-label="FDM 扩展目录">
          <button class="btn" id="copyPath">复制路径</button>
          <button class="btn" id="openFolder">打开文件夹</button>
        </div>
      </div>
      <div class="row">
        <label>状态</label>
        <div class="ctrl">
          <span class="status-wrap"><span class="dot" id="statusDot"></span><span id="statusText">正在检测扩展连接…</span></span>
        </div>
      </div>
    </div>
  </div>

  <div class="foot">
    <span class="hint">安装完成后关闭本窗口即可。之后可在「设置 → 常规 → 浏览器扩展」重新打开本向导。</span>
    <div class="spacer"></div>
    <button class="btn" id="closeBtn">关闭</button>
  </div>

  <script src="fdm-bridge.js"></script>
  <script src="extension-guide.js?v=2026102402"></script>
</body>
</html>
