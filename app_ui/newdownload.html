<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>下载文件信息</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: "Segoe UI","Microsoft YaHei",Tahoma,sans-serif; font-size: 11px; color: #1a1a1a;
    background: #f0f0f0; user-select: none; overflow: hidden; display: flex; flex-direction: column; }

  .scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 20px 12px 3px; background: #f0f0f0;
    scrollbar-width: thin; scrollbar-color: rgba(0,0,0,0.18) #f0f0f0; }
  .scroll::-webkit-scrollbar { width: 15px; }
  .scroll::-webkit-scrollbar-track { background: #f0f0f0; }
  .scroll::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.18); border: 3px solid #f0f0f0; }
  .scroll::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,0.28); }

  /* 分组框：仿 Win32 GroupBox */
  .section { position: relative; background: #f0f0f0; border: 0.5px solid rgba(0,0,0,0.12); border-radius: 6px;
    padding: 13px 12px 9px; margin: 0 0 22px; }
  .section:last-child { margin-bottom: 0; }
  /* 展开高级选项时底部留出呼吸空间 */
  #advancedSection { margin-bottom: 32px; }
  .section > h2 { position: absolute; top: -8px; left: 9px; padding: 0 5px; background: #f0f0f0;
    font-size: 11px; font-weight: 400; color: #1a1a1a; margin: 0; line-height: 1; }

  .row { display: flex; align-items: center; margin-bottom: 5px; min-height: 24px; }
  .row:last-child { margin-bottom: 0; }
  .row > label { flex: 0 0 56px; margin-right: 9px; color: #1a1a1a; line-height: 18px; }
  .row > label:empty { flex: 0 0 0; margin-right: 0; }
  .row.top { align-items: flex-start; }
  .row.top > label { padding-top: 2px; }
  .urltop { display: flex; align-items: flex-start; gap: 10px; }
  .urltop > .fields { flex: 1; min-width: 0; }
  .filebox { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .fileicon { width: 52px; height: 60px; background: #fff; border: 0.5px solid rgba(0,0,0,0.22);
    border-radius: 4px; position: relative; overflow: hidden; }
  .fileicon::after { content: ""; position: absolute; top: 0; right: 0; width: 0; height: 0;
    border-top: 12px solid #e8eaed; border-left: 12px solid transparent; }
  .filesize { font-size: 11px; color: #1a1a1a; line-height: 16px; font-weight: 600; }
  .ctrl { flex: 1; display: flex; align-items: center; gap: 8px; min-width: 0; }

  input[type=text], input[type=number], select, textarea {
    padding: 2px 5px; border: 0.5px solid rgba(0,0,0,0.20); border-radius: 4px; font-size: 11px;
    font-family: inherit; color: #1a1a1a; background: #fff; outline: none; }
  input[type=text], input[type=number], select { height: 22px; }
  input[type=text]:focus, input[type=number]:focus, select:focus, textarea:focus { border-color: #0078d7; }
  select { padding: 2px 4px; }
  input[type=number] { width: 70px; }
  .ctrl > input[type=text], .ctrl > select { flex: 1; }

  #urlBox { flex: 1; height: 50px; min-height: 50px; max-height: 110px; resize: vertical;
    line-height: 1.5; word-break: break-all; }
  #headers { flex: 1; height: 40px; resize: vertical; line-height: 1.5; font-family: Consolas, monospace; font-size: 11px; }

  .sizeval { color: #1a1a1a; }
  .hint { font-size: 11px; color: #666; }

  .sq { flex: 0 0 auto; width: 28px; height: 22px; padding: 0; border: 0.5px solid rgba(0,0,0,0.20);
    border-radius: 4px; background: #fff; color: #1a1a1a; cursor: pointer; font-size: 13px; line-height: 1; }
  .sq:hover { background: #e5f1fb; border-color: #0078d7; }
  .sq:active { background: #cce4f7; }

  .foot { flex: 0 0 auto; padding: 8px 12px; background: #f0f0f0;
    border-top: 0.5px solid rgba(0,0,0,0.12); display: flex; align-items: center; gap: 8px; }
  .foot .spacer { flex: 1; }
  .btn { padding: 3px 12px; border: 0.5px solid rgba(0,0,0,0.20); border-radius: 5px; background: #fff;
    color: #1a1a1a; cursor: pointer; font-size: 11px; font-family: inherit; min-height: 24px; min-width: 84px; }
  .btn:hover:not(:disabled) { background: #e5f1fb; border-color: #0078d7; }
  .btn:active:not(:disabled) { background: #cce4f7; }
  .btn:disabled { color: #9a9a9a; }
  .btn.small { padding: 2px 10px; min-height: 22px; color: #0066cc; border-color: transparent; background: transparent; }
  .btn.small:hover { color: #005a9e; background: transparent; border-color: transparent; text-decoration: underline; }

  /* 高级选项默认隐藏，由底部左侧按钮切换 */
  body.advanced-hidden #advancedSection { display: none; }

</style>
</head>
<body class="advanced-hidden">
  <div class="scroll">
    <div class="section">
      <h2>下载信息</h2>
      <div class="urltop">
        <div class="fields">
          <div class="row top">
            <label>URL</label>
            <div class="ctrl"><textarea id="urlBox" placeholder="粘贴或输入下载地址、magnet: 或 ed2k:// (Ctrl+V)"></textarea></div>
          </div>
          <div class="row">
            <label>另存为</label>
            <div class="ctrl">
              <input type="text" id="saveAs">
              <button class="sq" id="browse" title="选择保存位置">…</button>
            </div>
          </div>
        </div>
        <div class="filebox">
          <div class="fileicon"></div>
          <div class="filesize" id="fileSize">—</div>
        </div>
      </div>
    </div>

    <div class="section" id="advancedSection">
      <h2>高级选项</h2>
      <div class="row" data-http-only="1">
        <label>连接数</label>
        <div class="ctrl"><input type="text" id="conn" value="8"></div>
      </div>
      <div class="row">
        <label>限速</label>
        <div class="ctrl"><input type="text" id="rate" value="0"><span class="hint">KB/s，0 表示不限</span></div>
      </div>
      <div class="row top" data-http-only="1">
        <label>请求头</label>
        <div class="ctrl"><textarea id="headers" placeholder="自定义请求头（每行一个）如 Authorization: Bearer YOUR_TOKEN"></textarea></div>
      </div>
    </div>
  </div>

  <div class="foot">
    <button class="btn small" id="toggleAdvanced">&gt;&gt; 显示高级选项</button>
    <div class="spacer"></div>
    <button class="btn" id="later">稍后下载(L)</button>
    <button class="btn primary" id="start">开始下载(S)</button>
    <button class="btn" id="cancel">取消</button>
  </div>

  <script src="fdm-bridge.js"></script>
  <script src="newdownload.js?v=2026102401"></script>
</body>
</html>
